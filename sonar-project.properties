# SonarQube Project Configuration for Zprofile Node
sonar.projectKey=ZProfile
sonar.projectName=ZProfile
sonar.projectVersion=1.0.0

# Source & Test paths
sonar.sources=src
sonar.tests=tests
sonar.javascript.node.version=20
sonar.sourceEncoding=UTF-8

# TypeScript & Coverage
sonar.typescript.tsconfigPaths=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/public/**,**/*.sql,**/*.json,**/*.md,**/prisma/**
sonar.coverage.exclusions=src/app/**,src/components/**,src/types/**,src/lib/**,src/middleware.ts
sonar.cpd.exclusions=src/app/**,src/components/ui/**
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Multicriteria Issue Suppression
# S4790: Weak cryptographic hashing (MD5) is required for backwards compatibility with legacy WordPress phpass hashes
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S4790
sonar.issue.ignore.multicriteria.e1.resourceKey=src/server/utils/password-hasher.ts
