# SonarQube Project Configuration for Zprofile Node
sonar.projectKey=ZprofileNode
sonar.projectName=Zprofile Next.js Fullstack
sonar.projectVersion=1.0.0

# Source & Test paths
sonar.sources=src
sonar.tests=tests
sonar.javascript.node.version=20
sonar.sourceEncoding=UTF-8

# TypeScript & Coverage
sonar.typescript.tsconfigPaths=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/public/**,**/*.sql,**/*.json,**/*.md,**/prisma/**
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
