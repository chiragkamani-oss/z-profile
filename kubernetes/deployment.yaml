apiVersion: apps/v1
kind: Deployment
metadata:
  name: zprofile-node
  namespace: zymr-zprofile-prod
  labels:
    app: zprofile-node
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zprofile-node
  template:
    metadata:
      labels:
        app: zprofile-node
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: zprofile-node
          image: zprofile-node:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: zprofile-secrets
                  key: database-url
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: zprofile-secrets
                  key: nextauth-secret
            - name: NEXTAUTH_URL
              value: "https://zprofile.zymrinc.com"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
